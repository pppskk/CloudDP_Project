name: workflow1
on: push
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: set up nodejs
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: install package json
        run: npm install

      - name: Run testing
        run: node tests/unit_test.js
